<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login_Page</title>
    <style>
    .login{
        
        text-align: center;
        font-size: 30px;
   
        img{
            width: 250px;
             display: block; 
        
        margin: auto;
        }
        input{
            font-size: 20px;
        }
        button{
            font-size: 20px;
        }


    }
    </style>
</head>
<body>
    <div class="login">
        <img src="login.jpg" alt="">
       
        <label for="user" ><b>User_Name:</b></label>
        <input type="text" id="user" placeholder="enter  User_Name">
        <br>
        <br>
        <label for="password"><b>password:</b></label>
        <input type="text" placeholder="enter_Password" id="password">
        <br><br>
        <button>submit</button>
        <button>Reset</button>

    </div>
    
</body>
</html>
