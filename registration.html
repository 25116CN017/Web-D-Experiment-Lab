<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    
        .regi{
        font-size: 30px;
        input{
            font-size: 20px;
        }
        }
    </style>
</head>
<body>
    <div class="regi">
        <form action="" >
            <label for="name"><b></b>Name:</label>
            <input type="text" placeholder="enter_name" id="name">
            <br>
            <label for="pass"><br>Password:</label>
            <input type="text" placeholder="enter_Password" id="pass">
            <br><br>
            <label for="E-mail">E-mail:</label>
            <input type="text" placeholder="enter E-mail" id="E-mail">
            <br><br>
            <label for="num">Phone Number:</label>
            <input type="text" placeholder="enter Number " id="num">
            <br><br>
            <label for="sex">Gender:</label>
            <label for="male">male</label>

            <input type="radio" id="male" name="Gender" >
            <label for="female">female</label>
            <input type="radio" id="female" name="Gender">
            <br><br>
            <label for="dob">Date_Of_Birth</label>
        
            <select name="" id="dob"  >Date</select>
            
            <select name="" id="dob">Month</select>
            <select name="" id="dob">Year</select>
            <br><br>
            <label for=""  >Choose Language:</label>
            <br>
            
           <label for="eng" >English</label>
           <input type="checkbox" id="eng" name="lang" >
           <br>
           <label for="hin">Hindi</label>
           <input type="checkbox" id="hin" name="lang">
           <br>
           <label for="tel">Telugu</label>
            <input type="checkbox" id="tel" name="lang">
            <br><br>
            <label for="add">Address:</label>
            <input type="text" placeholder="enter_address"  id="add">
            
        </form>
    </div>
</body>
</html>
